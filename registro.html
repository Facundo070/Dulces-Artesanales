  <div class="formulario-container">
    <form>
      <h2>Crea tu Cuenta</h2>
      <p class="subtexto">Regístrate para guardar tus dulces favoritos y agilizar tus compras.</p>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>

      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="apellido" placeholder="Ingresa tu apellido" required>

      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" name="email" placeholder="tu.correo@ejemplo.com" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Crea una contraseña segura" required>

      <button type="submit">Crear Cuenta</button>

      <p class="login-link">¿Ya tienes una cuenta? <a href="index.html">Inicia Sesión</a></p>
    </form>
  </div>
